<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Fingrasp{% endblock %}</title>
  <meta name="description" content="{% block description %}Fingrasp — Device fingerprint intelligence platform for research & fraud prevention.{% endblock %}" />
  
<!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/assests/favicon.png">

    <!-- Main Styles -->
    <link rel="stylesheet" href="/static/css/style.css?v=1.1">
  {% block extra_css %}{% endblock %}

<script nonce="{{ nonce }}">
  // Set theme immediately to prevent flashing (validated to prevent XSS)
  const _saved = localStorage.getItem('theme');
  if (_saved === 'dark' || _saved === 'light') {
    document.documentElement.setAttribute('data-theme', _saved);
  }
</script>
</head>

<body>
  <div class="page">
    <header>
      {% block header %}
      <a href="/" class="logo-link">
        <div class="logo">Fin<span>grasp</span></div>
      </a>
      <div class="header-right">
        <div class="badge">
          <div class="dot"></div>Live
        </div>
        <button class="toggle" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
      </div>
      {% endblock %}
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      {% block footer %}
      <span>© Fingrasp</span>
      <span class="footer-sep">·</span>
      <a href="/privacy" class="link-privacy">Privacy Policy</a>
      <span class="footer-sep">·</span>
      <span>Powered by <a href="https://www.mixvisit.com" target="_blank" class="link-mixvisit">MixVisit</a></span>
      {% if request.path != '/' %}
      <span class="footer-sep">·</span>
      <a href="/" class="link-home">Home</a>
      {% endif %}
      {% endblock %}
    </footer>
  </div>

  <!-- Scroll to Top Button -->
  <button id="scrollToTopBtn" class="scroll-top-btn" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </button>

  <!-- Scripts -->
  <script nonce="{{ nonce }}" type="module" src="/static/js/app.js?v=1.1"></script>
  {% block extra_js %}{% endblock %}
</body>

</html>
