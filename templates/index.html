<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fingrasp</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #080b10;
      --surface: #111620;
      --surface2:#161d2b;
      --border:  rgba(99,179,237,0.13);
      --accent:  #63b3ed;
      --accent2: #4fd1c5;
      --text:    #e2e8f0;
      --muted:   #718096;
      --success: #68d391;
      --glow:    rgba(99,179,237,0.15);
    }
    [data-theme="light"] {
      --bg:      #f0f4f8;
      --surface: #ffffff;
      --surface2:#f7fafc;
      --border:  rgba(49,130,206,0.15);
      --accent:  #2b6cb0;
      --accent2: #2c7a7b;
      --text:    #1a202c;
      --muted:   #718096;
      --success: #276749;
      --glow:    rgba(49,130,206,0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      transition: background .3s, color .3s;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .page {
      position: relative; z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }
  </style>
</head>
<body>
<div class="page">

</div>
</body>
</html>
