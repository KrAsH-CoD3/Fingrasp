<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fingrasp</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #080b10;
      --surface: #111620;
      --surface2:#161d2b;
      --border:  rgba(99,179,237,0.13);
      --accent:  #63b3ed;
      --accent2: #4fd1c5;
      --text:    #e2e8f0;
      --muted:   #718096;
      --success: #68d391;
      --glow:    rgba(99,179,237,0.15);
    }
    [data-theme="light"] {
      --bg:      #f0f4f8;
      --surface: #ffffff;
      --surface2:#f7fafc;
      --border:  rgba(49,130,206,0.15);
      --accent:  #2b6cb0;
      --accent2: #2c7a7b;
      --text:    #1a202c;
      --muted:   #718096;
      --success: #276749;
      --glow:    rgba(49,130,206,0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      transition: background .3s, color .3s;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .page {
      position: relative; z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 48px;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .badge {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .toggle {
      width: 40px; height: 40px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 17px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: border-color .2s, box-shadow .2s;
    }
    .toggle:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }

    /* ── Hero ── */
    .hero { text-align: center; margin-bottom: 48px; }
    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(32px, 6vw, 58px);
      font-weight: 800; letter-spacing: -2px; line-height: 1.05;
      margin-bottom: 14px;
    }
    .hero h1 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero p { font-size: 12px; color: var(--muted); line-height: 1.9; }

    /* ── Loader ── */
    .loader {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      padding: 48px 0;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader p { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }

    /* ── Fingerprint Section ── */
    .fp-section {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    /* sticky top bar */
    .fp-bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .fp-bar-left { display: flex; align-items: center; gap: 8px; }
    .fp-bar-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }
    .fp-indicator { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }

    .copy-btn {
      display: flex; align-items: center; gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: 0.5px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px;
      cursor: pointer; transition: all .2s;
      white-space: nowrap;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px var(--glow); }
    .copy-btn.copied { border-color: var(--success); color: var(--success); }
    .copy-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* data body */
    .fp-body {
      padding: 20px;
      font-size: 12px; line-height: 2; color: var(--muted);
      max-height: 500px; overflow-y: auto;
    }
    .fp-body::-webkit-scrollbar { width: 3px; }
    .fp-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* syntax highlight */
    .jk { color: var(--accent2); }
    .js { color: #f6ad55; }
    .jn { color: var(--accent); }
    .jb { color: #fc8181; }

    /* ── Save Notice ── */
    .notice {
      display: none;
      align-items: center; gap: 8px;
      margin-top: 14px; padding: 12px 16px;
      border-radius: 10px; font-size: 11px;
      border: 1px solid transparent;
    }
    .notice.ok  { display:flex; background:rgba(104,211,145,.07); border-color:rgba(104,211,145,.2); color:var(--success); }
    .notice.err { display:flex; background:rgba(252,129,129,.07); border-color:rgba(252,129,129,.2); color:#fc8181; }
    .notice svg { width:14px; height:14px; flex-shrink:0; }
  </style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">Fin<span>grasp</span></div>
    <div class="header-right">
      <div class="badge"><div class="dot"></div>Live</div>
      <button class="toggle" id="themeBtn">🌙</button>
    </div>
  </header>

  <div class="hero">
    <h1>Your Device<br/><em>Fully Grasped</em></h1>
    <p>Fingerprint collected automatically on page load and saved to the database.</p>
  </div>

  <!-- Loader shown while MixVisit runs -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>Collecting fingerprint…</p>
  </div>

  <!-- Shown after fingerprint is collected -->
  <div class="fp-section" id="fpSection">
    <div class="fp-bar">
      <div class="fp-bar-left">
        <div class="fp-indicator"></div>
        <span class="fp-bar-title">Obtained Fingerprint</span>
      </div>
      <button class="copy-btn" id="copyBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
        Copy
      </button>
    </div>
    <div class="fp-body" id="fpBody"></div>
  </div>

  <div class="notice" id="notice"></div>

</div>

<script type="module">
  import { MixVisit } from '/static/mixvisit.js';

  // ── Theme toggle ──
  let dark = true;
  document.getElementById('themeBtn').addEventListener('click', () => {
    dark = !dark;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = dark ? '🌙' : '☀️';
  });

  // ── Syntax highlight ──
  function highlight(obj) {
    return JSON.stringify(obj, null, 2).replace(
      /("(?:\\.|[^"\\])*"(?=\s*:)|"(?:\\.|[^"\\])*"|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
      m => {
        if (/^".*":\s*$/.test(m + ' ')) return `<span class="jk">${m}</span>`;
        if (/".*":/.test(m))            return `<span class="jk">${m}</span>`;
        if (/^"/.test(m))               return `<span class="js">${m}</span>`;
        if (/true|false/.test(m))       return `<span class="jb">${m}</span>`;
        return `<span class="jn">${m}</span>`;
      }
    );
  }

  // ── Copy button ──
  let rawData = '';
  const copyBtn = document.getElementById('copyBtn');
  const COPY_HTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy`;
  const CHECK_HTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;

  copyBtn.addEventListener('click', async () => {
    await navigator.clipboard.writeText(rawData);
    copyBtn.classList.add('copied');
    copyBtn.innerHTML = CHECK_HTML;
    setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.innerHTML = COPY_HTML; }, 2000);
  });

  // ── Collect + display + save ──
  async function run() {
    const mv = new MixVisit();
    await mv.load();

    const payload = {
      hash:     mv.fingerprintHash,
      platform: mv.get('platform'),
      loadTime: mv.loadTime,
      signals:  mv.get(),
    };

    rawData = JSON.stringify(payload, null, 2);

    document.getElementById('loader').style.display    = 'none';
    document.getElementById('fpSection').style.display = 'block';
    document.getElementById('fpBody').innerHTML        = highlight(payload);

    try {
      const res    = await fetch('/save', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });
      const result = await res.json();
      const n = document.getElementById('notice');
      n.className = 'notice ok';
      n.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Saved to database — ID: ${result.id}`;
    } catch {
      const n = document.getElementById('notice');
      n.className = 'notice err';
      n.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> Could not save to database.`;
    }
  }

  window.addEventListener('load', run);
</script>
</body>
</html>
