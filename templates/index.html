<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fingrasp</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #080b10;
      --surface: #111620;
      --surface2:#161d2b;
      --border:  rgba(99,179,237,0.13);
      --accent:  #63b3ed;
      --accent2: #4fd1c5;
      --text:    #e2e8f0;
      --muted:   #718096;
      --success: #68d391;
      --glow:    rgba(99,179,237,0.15);
    }
    [data-theme="light"] {
      --bg:      #f0f4f8;
      --surface: #ffffff;
      --surface2:#f7fafc;
      --border:  rgba(49,130,206,0.15);
      --accent:  #2b6cb0;
      --accent2: #2c7a7b;
      --text:    #1a202c;
      --muted:   #718096;
      --success: #276749;
      --glow:    rgba(49,130,206,0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      transition: background .3s, color .3s;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .page {
      position: relative; z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 48px;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .badge {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .toggle {
      width: 40px; height: 40px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 17px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: border-color .2s, box-shadow .2s;
    }
    .toggle:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }

    /* ── Hero ── */
    .hero { text-align: center; margin-bottom: 48px; }
    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(32px, 6vw, 58px);
      font-weight: 800; letter-spacing: -2px; line-height: 1.05;
      margin-bottom: 14px;
    }
    .hero h1 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero p { font-size: 12px; color: var(--muted); line-height: 1.9; }
  </style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">Fin<span>grasp</span></div>
    <div class="header-right">
      <div class="badge"><div class="dot"></div>Live</div>
      <button class="toggle" id="themeBtn">🌙</button>
    </div>
  </header>

  <div class="hero">
    <h1>Your Device<br/><em>Fully Grasped</em></h1>
    <p>Fingerprint collected automatically on page load and saved to the database.</p>
  </div>

</div>
</body>
</html>
